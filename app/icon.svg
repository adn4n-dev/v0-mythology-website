<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0d2b1f"/>
  <!-- Phoenix / Anka bird -->
  <g transform="translate(4, 2)">
    <!-- Body -->
    <ellipse cx="12" cy="18" rx="4" ry="6" fill="#c9a84c"/>
    <!-- Head -->
    <circle cx="12" cy="10" r="3.5" fill="#c9a84c"/>
    <!-- Beak -->
    <polygon points="14,9 17,10 14,11" fill="#e8c96a"/>
    <!-- Eye -->
    <circle cx="13" cy="9.5" r="0.8" fill="#0d2b1f"/>
    <!-- Left wing -->
    <path d="M12 15 C6 10, 2 8, 1 5 C3 7, 5 9, 8 12 C6 8, 5 4, 7 2 C8 5, 9 9, 11 13Z" fill="#b8912e"/>
    <!-- Right wing -->
    <path d="M12 15 C18 10, 22 8, 23 5 C21 7, 19 9, 16 12 C18 8, 19 4, 17 2 C16 5, 15 9, 13 13Z" fill="#b8912e"/>
    <!-- Tail feathers -->
    <path d="M10 23 C8 26, 6 29, 5 30 C7 28, 9 26, 10 24Z" fill="#c9a84c"/>
    <path d="M12 24 C12 27, 12 30, 12 31 C12 28, 12 26, 12 24Z" fill="#e8c96a"/>
    <path d="M14 23 C16 26, 18 29, 19 30 C17 28, 15 26, 14 24Z" fill="#c9a84c"/>
    <!-- Crown/crest -->
    <path d="M10 7 C10 4, 11 2, 12 1 C13 2, 14 4, 14 7" fill="#e8c96a" opacity="0.8"/>
  </g>
</svg>
